name: Generate GitHub Stats SVGs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate stats card
        uses: anuraghazra/github-readme-stats@latest
        with:
          username: SothearithNith
          output_file: stats.svg
          theme: tokyonight
          bg_color: "0a0f1e"
          title_color: "00f5d4"
          icon_color: "f0a500"
          text_color: "c9d1d9"
          hide_border: true
          count_private: true
          include_all_commits: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top-langs card
        uses: anuraghazra/github-readme-stats@latest
        with:
          username: SothearithNith
          output_file: langs.svg
          card_type: top-langs
          layout: compact
          theme: tokyonight
          bg_color: "0a0f1e"
          title_color: "00f5d4"
          text_color: "c9d1d9"
          hide_border: true
          langs_count: 8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push SVGs to output branch
        run: |
          mkdir -p output-branch
          cp stats.svg output-branch/
          cp langs.svg output-branch/
          cd output-branch
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b output
          git add .
          git commit -m "chore: update stats SVGs"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/SothearithNith/SothearithNith.git" output
