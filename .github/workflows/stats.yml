name: Update GitHub Stats
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
permissions:
  contents: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download stats SVG
        run: |
          mkdir -p output
          # Replace YOUR-VERCEL-APP with your own deployed instance domain
          BASE="https://svg-mu-woad.vercel.app"
          for i in 1 2 3; do
            curl -fsSL --max-time 15 -o output/stats.svg \
              "${BASE}/api?username=SothearithNith&show_icons=true&theme=tokyonight&hide_border=true&bg_color=0a0f1e&title_color=00f5d4&icon_color=f0a500&text_color=c9d1d9&cache_seconds=0&v=$(date +%s)" \
              && grep -q "<svg" output/stats.svg \
              && echo "stats.svg OK" && break
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
            [ $i -eq 3 ] && echo "ERROR: stats.svg failed after 3 attempts" && exit 1
          done

      - name: Download langs SVG
        run: |
          BASE="https://svg-mu-woad.vercel.app"
          for i in 1 2 3; do
            curl -fsSL --max-time 15 -o output/langs.svg \
              "${BASE}/api/top-langs/?username=SothearithNith&layout=compact&theme=tokyonight&hide_border=true&bg_color=0a0f1e&title_color=00f5d4&text_color=c9d1d9&cache_seconds=0&v=$(date +%s)" \
              && grep -q "<svg" output/langs.svg \
              && echo "langs.svg OK" && break
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
            [ $i -eq 3 ] && echo "ERROR: langs.svg failed after 3 attempts" && exit 1
          done

      - name: Commit and push to output branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin output 2>/dev/null \
            && git checkout output \
            || git checkout --orphan output

          git add output/stats.svg output/langs.svg
          git diff --cached --quiet \
            && echo "No changes to commit" \
            || git commit -m "chore: update stats SVGs"

          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/SothearithNith/SothearithNith.git" output
