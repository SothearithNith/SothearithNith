name: Update GitHub Stats
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
permissions:
  contents: write
jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download SVG cards
        run: |
          mkdir -p output

          fetch() {
            for i in 1 2 3; do
              curl -fsSL --retry 2 --retry-delay 3 -o "$1" "$2" && return 0
              echo "Attempt $i failed, retrying..."
              sleep 5
            done
            echo "ERROR: failed to download $2"
            exit 1
          }

          fetch output/stats.svg \
            "https://github-readme-stats.vercel.app/api?username=SothearithNith&show_icons=true&theme=tokyonight&hide_border=true&bg_color=0a0f1e&title_color=00f5d4&icon_color=f0a500&text_color=c9d1d9&cache_seconds=0&v=$(date +%s)"

          fetch output/langs.svg \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=SothearithNith&layout=compact&theme=tokyonight&hide_border=true&bg_color=0a0f1e&title_color=00f5d4&text_color=c9d1d9&cache_seconds=0&v=$(date +%s)"

      - name: Validate SVG files
        run: |
          grep -q "<svg" output/stats.svg || { echo "stats.svg is invalid or missing"; exit 1; }
          grep -q "<svg" output/langs.svg  || { echo "langs.svg is invalid or missing";  exit 1; }
          echo "Both SVGs validated OK"

      - name: Commit and push to output branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin output 2>/dev/null \
            && git checkout output \
            || git checkout --orphan output

          git add output/stats.svg output/langs.svg
          git diff --cached --quiet \
            && echo "No changes to commit" \
            || git commit -m "chore: update stats SVGs"

          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/SothearithNith/SothearithNith.git" output
